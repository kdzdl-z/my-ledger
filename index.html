<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d0c"><meta name="description" content="本地保存、离线优先的个人日常记账应用"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>小账本</title><style>
:root{--bg:#0b0d0c;--panel:#141714;--panel2:#1b1f1b;--line:#2b302b;--text:#f1f2ed;--muted:#969c94;--green:#72c989;--green2:#183824;--amber:#dda94b;--amber2:#3d2c12;--danger:#ef7771;--radius:22px}*{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}body{margin:0;background:radial-gradient(circle at 80% -10%,#263127 0,transparent 32rem),var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100dvh}button,input,textarea{font:inherit}button{cursor:pointer}.app{max-width:920px;margin:auto;padding:22px 18px 106px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.brand{display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;border-radius:13px;background:var(--amber);color:#1b160d;display:grid;place-items:center;font-weight:900;font-size:21px}.top h1{font-size:20px;margin:0}.top small{color:var(--muted)}.pill{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:8px 12px}.view{display:none}.view.active{display:block}.card{background:linear-gradient(145deg,#171a17,#111311);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 18px 50px #0004}.card-title{font-weight:700;margin:0 0 14px}.type-switch{display:grid;grid-template-columns:1fr 1fr;background:#0d0f0d;padding:4px;border-radius:16px;margin-bottom:18px}.type-switch button{border:0;background:transparent;color:var(--muted);padding:12px;border-radius:12px;font-weight:700}.type-switch button.active.expense{background:var(--amber2);color:#ffd486}.type-switch button.active.income{background:var(--green2);color:#9be6ad}.amount-wrap{display:flex;align-items:center;border-bottom:1px solid var(--line);margin-bottom:18px}.currency{font-size:28px;color:var(--muted)}#amount{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:44px;font-weight:750;padding:8px 10px;min-width:0}#amount::placeholder{color:#414641}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label,.label{display:block;color:var(--muted);font-size:13px;margin:0 0 8px}.field input,textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:13px;padding:12px;outline:0;min-height:48px}.field input:focus,textarea:focus{border-color:#626a61}.categories{display:flex;flex-wrap:wrap;gap:9px;margin:8px 0 18px}.cat{border:1px solid var(--line);background:var(--panel2);color:#c7cbc4;border-radius:999px;padding:10px 14px;min-height:44px}.cat.active{border-color:var(--amber);background:var(--amber2);color:#ffd58d}.income-mode .cat.active{border-color:var(--green);background:var(--green2);color:#9be6ad}.add-cat{color:var(--amber);border-style:dashed}.primary{width:100%;border:0;background:var(--amber);color:#1b160d;border-radius:15px;padding:15px;font-weight:850;font-size:17px;min-height:54px}.income-mode .primary{background:var(--green)}textarea{resize:vertical;min-height:72px}.stats-head{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap}.seg{display:flex;background:var(--panel);border:1px solid var(--line);padding:3px;border-radius:13px}.seg button{border:0;background:transparent;color:var(--muted);padding:8px 13px;border-radius:9px}.seg button.active{background:#30362f;color:var(--text)}#periodInput{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:9px 12px;border-radius:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.metric{padding:16px;border:1px solid var(--line);border-radius:17px;background:var(--panel)}.metric small{display:block;color:var(--muted);margin-bottom:5px}.metric strong{font-size:20px}.expense-c{color:var(--amber)}.income-c{color:var(--green)}.charts{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.chart-card{min-height:290px}.chart-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.chart-head span{font-weight:700}.chart-head small{color:var(--muted)}canvas{width:100%;height:220px;display:block}.donut-wrap{display:grid;place-items:center;height:220px;position:relative}.donut-wrap canvas{position:absolute}.donut-center{text-align:center;z-index:1;pointer-events:none}.donut-center small{display:block;color:var(--muted)}.records{margin-top:14px}.record{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.record:last-child{border-bottom:0}.record-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--panel2)}.record-main b{display:block}.record-main small{color:var(--muted)}.record-amount{text-align:right;font-weight:800}.delete{border:0;background:transparent;color:#697067;font-size:18px;padding:8px}.empty{text-align:center;color:var(--muted);padding:36px 8px}.tools{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.tool{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:12px;min-height:44px}.file{display:none}.nav{position:fixed;z-index:10;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(460px,calc(100% - 28px));display:grid;grid-template-columns:1fr 1fr;background:#171a17eF;backdrop-filter:blur(18px);border:1px solid #343934;border-radius:21px;padding:6px;box-shadow:0 14px 45px #0009}.nav button{border:0;background:transparent;color:var(--muted);border-radius:15px;padding:12px;font-weight:750}.nav button.active{background:#30362f;color:var(--text)}.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:#eff3e9;color:#1b201b;padding:11px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:30;box-shadow:0 8px 30px #0008}.toast.show{opacity:1;transform:translate(-50%,0)}dialog{border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--text);width:min(420px,calc(100% - 30px));padding:20px}dialog::backdrop{background:#000b}dialog input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;margin:12px 0}.dialog-actions{display:flex;justify-content:flex-end;gap:9px}.dialog-actions button{border:0;border-radius:11px;padding:10px 14px}.cancel{background:var(--panel2);color:var(--text)}.confirm{background:var(--amber);color:#18130b}.legend{display:flex;gap:12px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.dot.e{background:var(--amber)}.dot.i{background:var(--green)}

</style></head><body><main class="app"><header class="top"><div class="brand"><div class="logo">账</div><div><h1>小账本</h1><small>数据只保存在你的设备里</small></div></div><button class="pill" id="todayBtn">今天</button></header>
<section id="entryView" class="view active"><div class="entry-layout"><form id="entryForm" class="card"><div class="type-switch"><button type="button" class="active expense" data-type="expense">支出</button><button type="button" data-type="income">收入</button></div><div class="amount-wrap"><span class="currency">¥</span><input id="amount" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="金额" required></div><div class="field-row"><div class="field"><label for="date">日期</label><input type="date" id="date" required></div><div class="field"><label for="note">备注（可选）</label><input id="note" maxlength="80" placeholder="写点什么…"></div></div><p class="label" style="margin-top:18px">分类</p><div id="categories" class="categories"></div><button class="primary" type="submit">记下这笔</button></form><aside class="card quick-note"><p class="card-title">最近记录</p><div id="recentList"></div></aside></div></section>
<section id="statsView" class="view"><div class="stats-head"><div class="seg" id="rangeSeg"><button data-range="day">日</button><button class="active" data-range="month">月</button><button data-range="year">年</button></div><input id="periodInput" type="month" aria-label="统计周期"></div><div class="summary"><div class="metric"><small>总支出</small><strong id="totalExpense" class="expense-c">¥0.00</strong></div><div class="metric"><small>总收入</small><strong id="totalIncome" class="income-c">¥0.00</strong></div><div class="metric"><small>结余</small><strong id="balance">¥0.00</strong></div></div><div class="charts"><div class="card chart-card"><div class="chart-head"><span>收支趋势</span><div class="legend"><span><i class="dot e"></i>支出</span><span><i class="dot i"></i>收入</span></div></div><canvas id="trendChart"></canvas></div><div class="card chart-card"><div class="chart-head"><span>支出分类</span><small id="catCount">0 类</small></div><div class="donut-wrap"><canvas id="donutChart"></canvas><div class="donut-center"><small>最大分类</small><b id="topCategory">暂无</b></div></div></div></div><div class="card records"><div class="chart-head"><span>账目明细</span><small id="recordCount">0 笔</small></div><div id="recordList"></div><div class="tools"><button class="tool" id="exportCsv">导出 CSV</button><button class="tool" id="exportJson">备份 JSON</button><button class="tool" id="importBtn">导入 JSON / Excel</button><input class="file" id="importFile" type="file" accept=".json,.csv,.xlsx,.xls"></div></div></section></main>
<nav class="nav"><button class="active" data-view="entryView">＋ 记一笔</button><button data-view="statsView">◫ 查看统计</button></nav><div id="toast" class="toast"></div><dialog id="catDialog"><form method="dialog"><h3 style="margin:0">新增分类</h3><input id="newCat" maxlength="10" placeholder="例如：医疗"><div class="dialog-actions"><button value="cancel" class="cancel">取消</button><button value="ok" class="confirm">添加</button></div></form></dialog>
<script>
(()=>{'use strict';const KEY='pocket-ledger-v1',CATS='pocket-ledger-categories-v1',defaultCats=['餐饮','交通','购物','娱乐','住房','工资','其他'],icons={'餐饮':'餐','交通':'行','购物':'购','娱乐':'乐','住房':'住','工资':'薪','其他':'·'};let records=load(KEY,[]),cats=load(CATS,defaultCats),type='expense',category='餐饮',range='month';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],money=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function save(){localStorage.setItem(KEY,JSON.stringify(records));localStorage.setItem(CATS,JSON.stringify(cats))}function localDate(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}$('#date').value=localDate();$('#periodInput').value=localDate().slice(0,7);$('#todayBtn').onclick=()=>{$('#date').value=localDate();showToast('日期已回到今天')};
function renderCats(){const el=$('#categories');el.innerHTML=cats.map(c=>`<button type="button" class="cat ${c===category?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')+'<button type="button" class="cat add-cat" data-add>＋ 自定义</button>';el.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderCats()});el.querySelector('[data-add]').onclick=()=>{$('#newCat').value='';$('#catDialog').showModal();setTimeout(()=>$('#newCat').focus(),80)}}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}renderCats();
$('#catDialog').addEventListener('close',()=>{if($('#catDialog').returnValue!=='ok')return;const c=$('#newCat').value.trim();if(!c)return;if(!cats.includes(c))cats.push(c);category=c;save();renderCats();showToast('分类已添加')});$$('.type-switch button').forEach(b=>b.onclick=()=>{type=b.dataset.type;$$('.type-switch button').forEach(x=>x.className='');b.classList.add('active',type);$('#entryForm').classList.toggle('income-mode',type==='income');category=type==='income'?(cats.includes('工资')?'工资':cats[0]):(cats.includes('餐饮')?'餐饮':cats[0]);renderCats()});
$('#entryForm').onsubmit=e=>{e.preventDefault();const amount=Number($('#amount').value.replace(',','.'));if(!Number.isFinite(amount)||amount<=0)return showToast('请输入有效金额');records.unshift({id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),type,amount:Math.round(amount*100)/100,category,note:$('#note').value.trim(),date:$('#date').value,createdAt:Date.now()});save();$('#amount').value='';$('#note').value='';renderRecent();renderStats();showToast(type==='expense'?'支出已记下':'收入已记下');$('#amount').focus()};
$$('.nav button').forEach(b=>b.onclick=()=>{$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.view').forEach(x=>x.classList.remove('active'));$('#'+b.dataset.view).classList.add('active');if(b.dataset.view==='statsView')setTimeout(renderStats,10)});
function recordHtml(r,del=true){return `<div class="record"><div class="record-icon">${esc(icons[r.category]||r.category.slice(0,1))}</div><div class="record-main"><b>${esc(r.category)}</b><small>${esc(r.date)}${r.note?' · '+esc(r.note):''}</small></div><div class="record-amount ${r.type==='income'?'income-c':'expense-c'}">${r.type==='income'?'+':'−'}${money(r.amount)}</div>${del?`<button class="delete" data-id="${r.id}" aria-label="删除">×</button>`:''}</div>`}function renderRecent(){const a=records.slice(0,5);$('#recentList').innerHTML=a.map(r=>recordHtml(r,false)).join('')||'<div class="empty">还没有记录<br>第一笔就从现在开始</div>'}renderRecent();
function periodMatch(r){const p=$('#periodInput').value;if(range==='day')return r.date===p;if(range==='month')return r.date.slice(0,7)===p;if(range==='year')return r.date.slice(0,4)===p}function filtered(){return records.filter(periodMatch)}function updateInput(){const i=$('#periodInput'),now=localDate();i.type=range==='day'?'date':range==='month'?'month':'number';if(range==='day')i.value=now;else if(range==='month')i.value=now.slice(0,7);else{i.min='2000';i.max='2100';i.step='1';i.value=now.slice(0,4)}}$$('#rangeSeg button').forEach(b=>b.onclick=()=>{range=b.dataset.range;$$('#rangeSeg button').forEach(x=>x.classList.toggle('active',x===b));updateInput();renderStats()});$('#periodInput').onchange=renderStats;
function renderStats(){const a=filtered(),ex=a.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0),inc=a.filter(r=>r.type==='income').reduce((s,r)=>s+r.amount,0);$('#totalExpense').textContent=money(ex);$('#totalIncome').textContent=money(inc);$('#balance').textContent=money(inc-ex);$('#balance').className=inc-ex>=0?'income-c':'expense-c';$('#recordCount').textContent=a.length+' 笔';$('#recordList').innerHTML=a.map(r=>recordHtml(r)).join('')||'<div class="empty">这个周期还没有账目</div>';$$('.delete').forEach(b=>b.onclick=()=>{if(confirm('删除这笔记录？')){records=records.filter(r=>r.id!==b.dataset.id);save();renderStats();renderRecent()}});drawTrend(a);drawDonut(a)}
function canvasSetup(c){const d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*d;c.height=h*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);return{x,w,h}}function buckets(a){const p=$('#periodInput').value,out=[];if(range==='day'){for(let h=0;h<24;h+=4)out.push({key:h,label:h+'时',e:0,i:0});a.forEach(r=>{const h=new Date(r.createdAt||0).getHours(),b=out[Math.min(5,Math.floor(h/4))];b[r.type==='income'?'i':'e']+=r.amount})}else if(range==='month'){const days=new Date(+p.slice(0,4),+p.slice(5,7),0).getDate();for(let d=1;d<=days;d++)out.push({key:d,label:d,e:0,i:0});a.forEach(r=>{const b=out[+r.date.slice(8,10)-1];if(b)b[r.type==='income'?'i':'e']+=r.amount})}else{for(let m=1;m<=12;m++)out.push({key:m,label:m+'月',e:0,i:0});a.forEach(r=>{const b=out[+r.date.slice(5,7)-1];if(b)b[r.type==='income'?'i':'e']+=r.amount})}return out}function drawTrend(a){const {x,w,h}=canvasSetup($('#trendChart')),bs=buckets(a),pad={l:10,r:8,t:15,b:28},max=Math.max(1,...bs.flatMap(b=>[b.e,b.i])),cw=(w-pad.l-pad.r)/bs.length;x.strokeStyle='#2c312c';x.lineWidth=1;for(let j=0;j<4;j++){const y=pad.t+(h-pad.t-pad.b)*j/3;x.beginPath();x.moveTo(pad.l,y);x.lineTo(w-pad.r,y);x.stroke()}[['e','#dda94b'],['i','#72c989']].forEach(([k,col])=>{x.strokeStyle=col;x.lineWidth=2.5;x.beginPath();bs.forEach((b,j)=>{const px=pad.l+cw*(j+.5),py=h-pad.b-(b[k]/max)*(h-pad.t-pad.b);j?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()});x.fillStyle='#7f867e';x.font='11px system-ui';x.textAlign='center';const step=Math.ceil(bs.length/6);bs.forEach((b,j)=>{if(j%step===0)x.fillText(b.label,pad.l+cw*(j+.5),h-8)})}
function drawDonut(a){const sums={};a.filter(r=>r.type==='expense').forEach(r=>sums[r.category]=(sums[r.category]||0)+r.amount);const items=Object.entries(sums).sort((a,b)=>b[1]-a[1]),total=items.reduce((s,x)=>s+x[1],0),{x,w,h}=canvasSetup($('#donutChart')),cx=w/2,cy=h/2,rad=Math.min(w,h)*.37,colors=['#dda94b','#72c989','#7f8fbd','#d77878','#b487c9','#70b4b8','#8d9a69'];x.lineWidth=26;x.lineCap='butt';if(!total){x.strokeStyle='#292e29';x.beginPath();x.arc(cx,cy,rad,0,Math.PI*2);x.stroke()}else{let s=-Math.PI/2;items.forEach((it,j)=>{const e=s+it[1]/total*Math.PI*2;x.strokeStyle=colors[j%colors.length];x.beginPath();x.arc(cx,cy,rad,s,e);x.stroke();s=e})}$('#catCount').textContent=items.length+' 类';$('#topCategory').textContent=items[0]?.[0]||'暂无'}window.addEventListener('resize',()=>{$('#statsView').classList.contains('active')&&renderStats()});
function download(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('#exportJson').onclick=()=>download('小账本备份-'+localDate()+'.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),categories:cats,records},null,2),'application/json');$('#exportCsv').onclick=()=>{const q=v=>'"'+String(v??'').replaceAll('"','""')+'"',rows=[['日期','类型','金额','分类','备注'],...records.map(r=>[r.date,r.type==='income'?'收入':'支出',r.amount,r.category,r.note])];download('小账本-'+localDate()+'.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv;charset=utf-8')};$('#importBtn').onclick=()=>$('#importFile').click();
function detect(row,names){const keys=Object.keys(row),norm=s=>String(s).toLowerCase().replace(/[\s_-]/g,'');for(const n of names){const k=keys.find(k=>norm(k)===norm(n)||norm(k).includes(norm(n)));if(k)return row[k]}return undefined}function normalizeRows(rows){return rows.map((row,idx)=>{let amount=Number(String(detect(row,['金额','amount','money','数额'])??'').replace(/[¥￥,\s]/g,'')),rawType=String(detect(row,['类型','收支','type','incomeexpense'])??'').toLowerCase(),date=detect(row,['日期','时间','date','day']),cat=detect(row,['分类','类别','category'])||'其他',note=detect(row,['备注','说明','note','memo','description'])||'';let t=/收|income|工资/.test(rawType)?'income':/支|expense|消费/.test(rawType)?'expense':amount<0?'expense':'expense';amount=Math.abs(amount);if(date instanceof Date)date=localDate(date);else{const d=new Date(date);date=!isNaN(d)?localDate(d):String(date||'').slice(0,10)}if(!amount||!/^\d{4}-\d{2}-\d{2}$/.test(date))return null;cat=String(cat).trim()||'其他';if(!cats.includes(cat))cats.push(cat);return{id:'imp-'+Date.now()+'-'+idx+'-'+Math.random(),type:t,amount,category:cat,note:String(note).trim(),date,createdAt:new Date(date).getTime()}}).filter(Boolean)}
$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{let imported=[];if(f.name.toLowerCase().endsWith('.json')){const data=JSON.parse(await f.text()),arr=Array.isArray(data)?data:(data.records||data.data||[]);imported=arr.map((r,i)=>({id:r.id||'json-'+Date.now()+'-'+i,type:r.type==='income'||/收/.test(r.type)?'income':'expense',amount:Math.abs(Number(r.amount)),category:r.category||'其他',note:r.note||'',date:String(r.date).slice(0,10),createdAt:r.createdAt||Date.now()})).filter(r=>r.amount&&/^\d{4}-\d{2}-\d{2}$/.test(r.date));if(Array.isArray(data.categories))cats=[...new Set([...cats,...data.categories])]}else{await ensureXLSX();const buf=await f.arrayBuffer(),wb=XLSX.read(buf,{type:'array',cellDates:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});imported=normalizeRows(rows)}if(!imported.length)throw new Error('没有识别到有效记录');records=[...imported,...records];save();renderCats();renderRecent();renderStats();showToast('成功导入 '+imported.length+' 笔')}catch(err){alert('导入失败：'+err.message+'\n请确认包含日期、金额等字段。')}finally{e.target.value=''}};function ensureXLSX(){if(window.XLSX)return Promise.resolve();return new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('Excel 解析组件加载失败，请联网后重试'));document.head.appendChild(s)})}let tt;function showToast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}renderStats();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();

<script>
(()=>{'use strict';const RK='pocket-ledger-v1',CK='pocket-ledger-categories-v1',MK='pocket-ledger-category-meta-v1';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let meta=read(MK,{}),editingId=null,pendingCsv=[];function read(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function recs(){return read(RK,[])}function cats(){return read(CK,['餐饮','交通','购物','娱乐','住房','工资','其他'])}function writeRecords(a){localStorage.setItem(RK,JSON.stringify(a));refreshBase()}function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function refreshBase(){window.dispatchEvent(new Event('resize'));location.hash='updated';setTimeout(()=>{location.hash=''},0);renderV2()}function catColor(c){return meta[c]?.color||'#dda94b'}
function install(){const tools=$('.tools');if(tools&&!$('#manageOpen'))tools.insertAdjacentHTML('afterbegin','<button class="tool" id="manageOpen">管理账目</button><button class="tool" id="categoryOpen">分类管理</button>');const stats=$('#statsView');if(stats&&!$('#streakCard')){$('.summary').insertAdjacentHTML('afterend','<div class="v2-strip"><button class="v2-mini" id="streakCard"><small>连续记账</small><strong id="streakValue">0 天</strong></button><button class="v2-mini" id="monthDaysCard"><small>本月已记</small><strong id="monthDaysValue">0 天</strong></button></div><div class="card calendar"><div class="cal-head"><b>记账日历</b><small style="color:var(--muted)">点日期查看当天</small></div><div class="cal-grid" id="calendarGrid"></div></div>')}bind();renderV2()}
function bind(){$('#manageOpen').onclick=openManage;$('#categoryOpen').onclick=openCats;$('#closeManage').onclick=()=>$('#manageDialog').close();$('#closeCategoryManage').onclick=()=>$('#categoryDialog').close();$('#cancelEdit').onclick=()=>$('#editDialog').close();$('#saveEdit').onclick=saveEdit;$('#selectAll').onclick=()=>{$$('#manageList input[type=checkbox]').forEach(x=>x.checked=true)};$('#applyCategory').onclick=()=>bulkChange('category',$('#bulkCategory').value);$('#applyType').onclick=()=>bulkChange('type',$('#bulkType').value);$('#bulkDelete').onclick=bulkDelete;$('#cancelCsv').onclick=()=>{$('#csvPreviewDialog').close();pendingCsv=[]};$('#confirmCsv').onclick=commitCsv;const f=$('#importFile');f.addEventListener('change',csvCapture,true)}
function $$(s){return [...document.querySelectorAll(s)]}function streak(){const days=[...new Set(recs().map(r=>r.date))].sort().reverse(),today=new Date(),hasToday=days.includes(fmt(today));let cursor=new Date(today);if(!hasToday)cursor.setDate(cursor.getDate()-1);let n=0;while(days.includes(fmt(cursor))){n++;cursor.setDate(cursor.getDate()-1)}return n}function fmt(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function renderV2(){if(!$('#calendarGrid'))return;const now=new Date(),ym=($('#periodInput').value||fmt(now).slice(0,7)).slice(0,7),rr=recs(),days=new Set(rr.map(r=>r.date));$('#streakValue').textContent=streak()+' 天';$('#monthDaysValue').textContent=[...days].filter(d=>d.startsWith(fmt(now).slice(0,7))).length+' 天';const [y,m]=ym.split('-').map(Number),count=new Date(y,m,0).getDate(),first=(new Date(y,m-1,1).getDay()+6)%7,labels=['一','二','三','四','五','六','日'];let h=labels.map(x=>'<div class="cal-label">'+x+'</div>').join('')+'<div></div>'.repeat(first);for(let d=1;d<=count;d++){const date=ym+'-'+String(d).padStart(2,'0'),sum=rr.filter(r=>r.date===date&&r.type==='expense').reduce((s,r)=>s+r.amount,0);h+=`<button class="cal-day ${days.has(date)?'has':''} ${date===fmt(now)?'today':''}" data-date="${date}">${d}${sum?'<span class="cal-money">−'+Math.round(sum)+'</span>':''}</button>`}$('#calendarGrid').innerHTML=h;$$('.cal-day').forEach(b=>b.onclick=()=>{const i=$('#periodInput');document.querySelector('[data-range="day"]').click();i.value=b.dataset.date;i.dispatchEvent(new Event('change'));$$('.cal-day').forEach(x=>x.classList.toggle('selected',x===b));window.scrollTo({top:$('#recordList').getBoundingClientRect().top+scrollY-20,behavior:'smooth'})})}
function openManage(){const cc=cats();$('#bulkCategory').innerHTML='<option value="">选择分类</option>'+cc.map(c=>`<option>${esc(c)}</option>`).join('');$('#manageList').innerHTML=recs().map(r=>`<div class="manage-row"><input type="checkbox" value="${r.id}" aria-label="选择账目"><button data-edit="${r.id}"><b>${esc(r.category)} · ${r.type==='income'?'收入':'支出'}</b><small style="display:block;color:var(--muted)">${esc(r.date)} ${esc(r.note||'')}</small></button><b class="${r.type==='income'?'income-c':'expense-c'}">${r.type==='income'?'+':'−'}¥${Number(r.amount).toFixed(2)}</b></div>`).join('')||'<div class="empty">没有可管理的账目</div>';$$('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));$('#manageDialog').showModal()}
function selected(){return new Set($$('#manageList input:checked').map(x=>x.value))}function bulkChange(key,val){const ids=selected();if(!ids.size||!val)return toast('请先选择账目和修改值');writeRecords(recs().map(r=>ids.has(r.id)?{...r,[key]:val}:r));openManage();toast('已修改 '+ids.size+' 笔')}function bulkDelete(){const ids=selected();if(!ids.size)return toast('请先选择账目');if(!confirm('删除选中的 '+ids.size+' 笔记录？'))return;writeRecords(recs().filter(r=>!ids.has(r.id)));openManage();toast('已删除 '+ids.size+' 笔')}
function openEdit(id){const r=recs().find(x=>x.id===id);if(!r)return;editingId=id;$('#editAmount').value=r.amount;$('#editDate').value=r.date;$('#editType').value=r.type;$('#editCategory').innerHTML=cats().map(c=>`<option ${c===r.category?'selected':''}>${esc(c)}</option>`).join('');$('#editNote').value=r.note||'';$('#editDialog').showModal()}function saveEdit(){const a=Number($('#editAmount').value);if(!(a>0))return toast('请输入有效金额');writeRecords(recs().map(r=>r.id===editingId?{...r,amount:Math.round(a*100)/100,date:$('#editDate').value,type:$('#editType').value,category:$('#editCategory').value,note:$('#editNote').value.trim()}:r));$('#editDialog').close();openManage();toast('账目已更新')}
function openCats(){const cs=cats();$('#categoryManageList').innerHTML=cs.map(c=>`<div class="cat-manage-row"><input type="color" value="${catColor(c)}" data-color="${esc(c)}"><input type="text" value="${esc(c)}" data-name="${esc(c)}" maxlength="10"><button class="delete" data-remove-cat="${esc(c)}">×</button></div>`).join('')+'<button class="tool" id="addManagedCat">＋ 新增分类</button>';$$('[data-color]').forEach(x=>x.onchange=()=>{meta[x.dataset.color]={...(meta[x.dataset.color]||{}),color:x.value};localStorage.setItem(MK,JSON.stringify(meta));applyColors()});$$('[data-name]').forEach(x=>x.onchange=()=>renameCat(x.dataset.name,x.value.trim()));$$('[data-remove-cat]').forEach(x=>x.onclick=()=>removeCat(x.dataset.removeCat));$('#addManagedCat').onclick=()=>{const n=prompt('新分类名称');if(n&& !cs.includes(n.trim())){localStorage.setItem(CK,JSON.stringify([...cs,n.trim()]));openCats();toast('分类已新增')}};$('#categoryDialog').showModal();applyColors()}
function renameCat(old,n){if(!n||old===n)return;if(cats().includes(n))return toast('分类名称已存在');localStorage.setItem(CK,JSON.stringify(cats().map(c=>c===old?n:c)));writeRecords(recs().map(r=>r.category===old?{...r,category:n}:r));if(meta[old]){meta[n]=meta[old];delete meta[old];localStorage.setItem(MK,JSON.stringify(meta))}openCats();toast('分类已重命名')}function removeCat(c){if(cats().length<=1)return toast('至少保留一个分类');if(!confirm('删除分类“'+c+'”？已有记录会移到“其他”。'))return;let cs=cats().filter(x=>x!==c);if(!cs.includes('其他'))cs.push('其他');localStorage.setItem(CK,JSON.stringify(cs));writeRecords(recs().map(r=>r.category===c?{...r,category:'其他'}:r));delete meta[c];localStorage.setItem(MK,JSON.stringify(meta));openCats()}function applyColors(){$$('.cat[data-cat]').forEach(b=>{const color=catColor(b.dataset.cat);b.style.setProperty('--cat-color',color);b.style.borderColor=b.classList.contains('active')?color:''})}
async function csvCapture(e){const f=e.target.files?.[0],name=f?.name.toLowerCase()||'';if(!f||(!name.endsWith('.csv')&&!name.endsWith('.json')))return;e.stopImmediatePropagation();try{let mapped;if(name.endsWith('.json'))mapped=mapBackupJson(JSON.parse((await f.text()).replace(/^\uFEFF/,'')));else{const buf=await f.arrayBuffer(),text=decodeCsv(buf),rows=parseCsv(text);mapped=mapCsv(rows)}pendingCsv=mapped.valid;$('#csvSummary').textContent=`识别到 ${mapped.valid.length} 笔有效记录，${mapped.invalid} 行需要跳过。`;$('#csvPreview').innerHTML=mapped.valid.slice(0,30).map(r=>`<div class="preview-row"><span>${r.date}</span><span>${esc(r.category)} · ${esc(r.note)}</span><b class="${r.type==='income'?'income-c':'expense-c'}">¥${r.amount}</b></div>`).join('')+(mapped.valid.length>30?'<div class="preview-row">仅预览前 30 笔</div>':'');$('#csvPreviewDialog').showModal()}catch(err){alert((name.endsWith('.json')?'JSON':'CSV')+' 识别失败：'+err.message)}finally{e.target.value=''}}
function mapBackupJson(data){const arr=Array.isArray(data)?data:(data.records||data.recs||data.transactions||data.entries||data.data||[]);if(!Array.isArray(arr)||!arr.length)throw new Error('未找到 records、recs 或 data 账目数组');let invalid=0;const valid=[];arr.forEach((r,k)=>{const rawType=String(r.type??r.kind??r.direction??'').toLowerCase(),rawAmount=Number(String(r.amount??r.money??r.value??'').replace(/[¥￥,，\s]/g,'')),type=/^(income|inc|in|收入|收)$/.test(rawType)||/收入|income/.test(rawType)?'income':/^(expense|exp|out|支出|支)$/.test(rawType)||/支出|expense/.test(rawType)?'expense':rawAmount<0?'expense':'expense',date=parseDate(r.date??r.day??r.time??r.createdAt),category=String(r.category??r.cat??r.classification??'其他').trim()||'其他';if(!(Math.abs(rawAmount)>0)||!date){invalid++;return}valid.push({id:String(r.id??('json-'+Date.now()+'-'+k+'-'+Math.random())),type,amount:Math.round(Math.abs(rawAmount)*100)/100,category,note:String(r.note??r.memo??r.remark??'').trim(),date,createdAt:Number(r.createdAt)||new Date(date).getTime()})});return{valid,invalid}}
function decodeCsv(buf){let t=new TextDecoder('utf-8',{fatal:false}).decode(buf),bad=(t.match(/�/g)||[]).length;if(bad>2)try{t=new TextDecoder('gb18030').decode(buf)}catch{}return t.replace(/^\uFEFF/,'')}function parseCsv(text){const first=text.split(/\r?\n/).find(x=>x.trim())||'',ds=[',',';','\t','|'],d=ds.sort((a,b)=>first.split(b).length-first.split(a).length)[0];const lines=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"')q=!q;else if(c===d&&!q){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell.trim());if(row.some(Boolean))lines.push(row);row=[];cell=''}else cell+=c}row.push(cell.trim());if(row.some(Boolean))lines.push(row);return lines}
function mapCsv(rows){if(rows.length<2)throw new Error('文件没有可读取的数据');const norm=s=>String(s).toLowerCase().replace(/[\s_\-()（）]/g,''),head=rows[0].map(norm),idx=names=>head.findIndex(h=>names.some(n=>h.includes(norm(n)))),di=idx(['日期','时间','date','day']),ai=idx(['金额','amount','money','数额','收入','支出']),ti=idx(['类型','收支','type']),ci=idx(['分类','类别','category']),ni=idx(['备注','说明','note','memo','description']);if(di<0||ai<0)throw new Error('至少需要“日期”和“金额”两列');let invalid=0;const valid=[];rows.slice(1).forEach((r,k)=>{let raw=String(r[ai]||'').replace(/[¥￥,，\s]/g,''),amount=Number(raw),date=parseDate(r[di]),ts=String(r[ti]||'').toLowerCase(),type=/收|income|工资/.test(ts)?'income':/支|expense|消费/.test(ts)?'expense':amount<0?'expense':head[ai].includes('收入')?'income':'expense',category=String(r[ci]||'其他').trim()||'其他';amount=Math.abs(amount);if(!(amount>0)||!date){invalid++;return}valid.push({id:'csv-'+Date.now()+'-'+k+'-'+Math.random(),type,amount:Math.round(amount*100)/100,category,note:String(r[ni]||'').trim(),date,createdAt:new Date(date).getTime()})});return{valid,invalid}}
function parseDate(v){const s=String(v||'').trim();if(/^\d{5}(\.\d+)?$/.test(s)){const d=new Date((Number(s)-25569)*86400000);return fmt(d)}const m=s.match(/^(\d{4})[\/\.\-年](\d{1,2})[\/\.\-月](\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');const d=new Date(s);return isNaN(d)?null:fmt(d)}function commitCsv(){if(!pendingCsv.length)return;const cs=new Set(cats()),newCats=[];pendingCsv.forEach(r=>{if(!cs.has(r.category)){cs.add(r.category);newCats.push(r.category)}});if(newCats.length)localStorage.setItem(CK,JSON.stringify([...cs]));writeRecords([...pendingCsv,...recs()]);const n=pendingCsv.length;pendingCsv=[];$('#csvPreviewDialog').close();toast('成功导入 '+n+' 笔')}
install();new MutationObserver(()=>applyColors()).observe($('#categories'),{childList:true});$('#periodInput').addEventListener('change',renderV2);window.addEventListener('storage',renderV2);
})();

<script>
(()=>{'use strict';const RK='pocket-ledger-v1',MK='pocket-ledger-category-meta-v1',palette=['#dda94b','#72c989','#7f8fbd','#d77878','#b487c9','#70b4b8','#8d9a69','#d18a58','#68a0c2'];const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),money=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});function read(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function selectedRecords(){const all=read(RK,[]),p=$('#periodInput')?.value||'',active=$('#rangeSeg .active')?.dataset.range||'month';return all.filter(r=>active==='day'?r.date===p:active==='year'?r.date.slice(0,4)===p:r.date.slice(0,7)===p)}function draw(){const canvas=$('#donutChart');if(!canvas||!$('#statsView')?.classList.contains('active'))return;let legend=$('#donutLegend');if(!legend){legend=document.createElement('div');legend.id='donutLegend';legend.className='donut-legend';canvas.closest('.chart-card').appendChild(legend)}const sums={};selectedRecords().filter(r=>r.type==='expense').forEach(r=>sums[r.category]=(sums[r.category]||0)+Number(r.amount||0));const items=Object.entries(sums).sort((a,b)=>b[1]-a[1]),total=items.reduce((s,x)=>s+x[1],0),meta=read(MK,{}),colors=items.map((it,j)=>meta[it[0]]?.color||palette[j%palette.length]),d=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*d;canvas.height=h*d;const x=canvas.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);const cx=w/2,cy=h/2,rad=Math.min(w,h)*.37;x.lineWidth=26;x.lineCap='butt';if(!total){x.strokeStyle='#292e29';x.beginPath();x.arc(cx,cy,rad,0,Math.PI*2);x.stroke()}else{let s=-Math.PI/2;items.forEach((it,j)=>{const e=s+it[1]/total*Math.PI*2;x.strokeStyle=colors[j];x.beginPath();x.arc(cx,cy,rad,s,e);x.stroke();s=e})}$('#catCount').textContent=items.length+' 类';$('#topCategory').textContent=items[0]?.[0]||'暂无';legend.innerHTML=items.length?items.map((it,j)=>`<div class="donut-legend-row"><span class="donut-legend-name"><i style="background:${colors[j]}"></i>${esc(it[0])}</span><span class="donut-legend-value">${money(it[1])} · <b>${(it[1]/total*100).toFixed(1)}%</b></span></div>`).join(''):'<div class="donut-legend-empty">当前周期暂无支出</div>'}

<script>
(()=>{'use strict';const RK='pocket-ledger-v1',CK='pocket-ledger-categories-v1',read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}},$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function moveTools(){const tools=$('.records>.tools'),list=$('#recordList');if(tools&&list&&tools.nextElementSibling!==list)list.parentNode.insertBefore(tools,list)}function ensureCategorySelect(){const bar=$('#manageDialog .bulkbar');if(!bar||$('#selectSameCategory'))return;const group=document.createElement('div');group.className='category-select-group';group.innerHTML='<select id="selectCategory" aria-label="选择同一分类"></select><button class="tool" id="selectSameCategory">选择该类别全部账目</button>';bar.insertBefore(group,bar.firstChild);$('#selectSameCategory').onclick=selectSameCategory}function fillCategorySelect(){ensureCategorySelect();const cs=read(CK,['餐饮','交通','购物','娱乐','住房','工资','其他']),sel=$('#selectCategory');if(sel)sel.innerHTML='<option value="">选择要勾选的分类</option>'+cs.map(c=>'<option value="'+escapeHtml(c)+'">'+escapeHtml(c)+'</option>').join('')}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function selectSameCategory(){const cat=$('#selectCategory')?.value;if(!cat)return notify('请先选择一个分类');const ids=new Set(read(RK,[]).filter(r=>r.category===cat).map(r=>String(r.id)));let count=0;$$('#manageList input[type=checkbox]').forEach(x=>{x.checked=ids.has(String(x.value));if(x.checked)count++});notify('已选择“'+cat+'”的 '+count+' 笔账目')}function notify(s){const t=$('#toast');if(!t)return;t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}moveTools();ensureCategorySelect();$('#manageOpen')?.addEventListener('click',()=>setTimeout(fillCategorySelect,0));new MutationObserver(()=>{moveTools();ensureCategorySelect()}).observe(document.body,{childList:true,subtree:true});
